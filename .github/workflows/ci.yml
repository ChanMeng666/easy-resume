name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Harmless placeholder values so `next build` can construct clients that read
    # env at module init (e.g. Stack Auth) during static generation. No real
    # secrets are needed: tests use DI fakes and the Typst binary is not required
    # (the golden-set test self-skips when typst is absent).
    env:
      NEXT_PUBLIC_STACK_PROJECT_ID: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-placeholder
      STACK_SECRET_SERVER_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next build` collects page data by importing route modules; the Neon and
      # Stripe clients are constructed at module scope and only need a value to
      # exist — nothing connects during the build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      OPENAI_API_KEY: sk-ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps matches the Dockerfile's npm ci: @stackframe/stack
        # pins a react-18-era lucide-react, and the lockfile is resolved under
        # this flag. A plain npm ci re-resolves peers strictly and demands a
        # different esbuild tree than the lockfile records.
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        # Gate on high/critical advisories in runtime deps only (dev tooling is
        # not shipped). Dependabot (see .github/dependabot.yml) keeps this green.
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Secret scan (gitleaks) — a non-bypassable gate for this public repo. Runs
  # independently of `checks`/`cli` so it can execute in parallel. Reads the
  # shared .gitleaks.toml (which allowlists the known CI placeholders above), so
  # a real committed credential fails CI while the placeholders do not.
  #
  # This runs the plain gitleaks CLI rather than `gitleaks/gitleaks-action@v3`.
  # The action's startup calls the GitHub API (`GET /users/{owner}`) to decide
  # whether the repo owner is an Organization, which needs a paid
  # GITLEAKS_LICENSE; personal accounts don't. That call is not optional and the
  # action fails CLOSED when it errors — a transient GitHub API 5xx (observed
  # 2026-07-20) turned this "security gate" into a false failure across every
  # open PR:
  #   Get user [ChanMeng666] failed with error [HttpError: No server is
  #   currently available to service your request...]. License key validation
  #   will be enforced.
  #   missing gitleaks license. Go grab one at gitleaks.io and store it as a
  #   GitHub Secret named GITLEAKS_LICENSE.
  # The plain CLI (MIT-licensed) needs no license key for any account type and
  # makes zero GitHub API calls, so there is no fail-closed path to trip.
  #
  # The version is pinned to v8.30.1 to match `.pre-commit-config.yaml`'s
  # `rev: v8.30.1` local hook, so CI and the pre-commit hook always run the
  # identical rule set (the old action installed 8.24.3, which had drifted).
  # The download is checksum-verified against gitleaks' published release
  # checksums, following the same convention as the Dockerfile's
  # `ADD --checksum=sha256:...` pins for the typst binary and FA package.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so pushes scan the whole commit range, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned + checksum-verified download of the linux x64 release asset
        # (matches ubuntu-latest). Checksum sourced from gitleaks' own
        # gitleaks_8.30.1_checksums.txt published alongside the release.
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan for secrets
        # --redact so a real finding never prints the secret value into public
        # CI logs; --exit-code 1 fails the job on any leak.
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1

  # Isolated job for the in-repo `vitex-cli` package (cli/). It has its own
  # standalone toolchain and lockfile with clean peer deps, so it installs with a
  # plain `npm ci` (no --legacy-peer-deps) and never touches the root app.
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
